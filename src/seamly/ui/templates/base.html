<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Seamly{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Seamly</a>
    <nav>
      <a href="/">Board</a>
      <a href="/worklist">Worklist</a>
    </nav>
    <div class="who">
      {% if actor and actor != 'anonymous' %}
        <span>{{ actor }} ({{ role }})</span>
        <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <form method="post" action="/run-pipeline">
      <button type="submit">Load sources and reconcile</button>
    </form>
  </footer>
</body>
</html>
