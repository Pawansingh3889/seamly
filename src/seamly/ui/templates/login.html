{% extends "base.html" %}
{% block title %}Log in : Seamly{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stacked">
  <label>Email <input type="email" name="email" required></label>
  <label>Password <input type="password" name="password" required></label>
  <button type="submit">Log in</button>
</form>
<form method="post" action="/login">
  <input type="hidden" name="email" value="cfo@kestrel.example">
  <input type="hidden" name="password" value="demo-secret">
  <button type="submit" class="secondary">Enter the demo as CFO</button>
</form>
<p class="hint">Demo user: cfo@kestrel.example / demo-secret. All data is synthetic.</p>
{% endblock %}
